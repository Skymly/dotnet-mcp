name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The jobs only read the repository.
permissions:
  contents: read

# A new commit on a pull request cancels that pull request's older run. Every push to main keeps its own
# group, so no main commit is ever left without a finished run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # Product SDK: global.json 10.0.100 + rollForward latestFeature (10.0.x, not a patch pin).
          # 8.0.x / 9.0.x stay floating: SampleFilter/MultiTfm fixtures need those MSBuild workloads.
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Check C# whitespace formatting
        # Linux only: a Windows checkout turns line endings into CRLF, which the end_of_line = lf rule would flag.
        # Folders need the trailing slash. Without it nothing matches and the check passes without looking at a file.
        if: matrix.os == 'ubuntu-latest'
        run: dotnet format whitespace . --folder --include src/ tests/DotNetMcp.Tests/ benches/ --exclude "**/bin/**" "**/obj/**" --verify-no-changes

      - name: Verify package versions match
        shell: pwsh
        run: |
          $csproj = Get-Content src/DotNetMcp.Server/DotNetMcp.Server.csproj -Raw
          if ($csproj -notmatch '<Version>([^<]+)</Version>') { throw "csproj <Version> missing" }
          $version = $Matches[1]
          $json = Get-Content src/DotNetMcp.Server/.mcp/server.json -Raw | ConvertFrom-Json
          if ($json.version -ne $version) { throw "server.json version '$($json.version)' != csproj '$version'" }
          if ($null -ne $json.packages) {
            foreach ($pkg in @($json.packages)) {
              if ([string]$pkg.registryType -ne 'nuget') { continue }
              $id = ([string]$pkg.identifier).ToLowerInvariant()
              $pkgVersion = if ($pkg.version) { [string]$pkg.version } else { $version }
              $url = "https://api.nuget.org/v3-flatcontainer/$id/index.json"
              try {
                $resp = Invoke-WebRequest -Uri $url -UseBasicParsing
              } catch {
                throw "server.json nuget package $id@$pkgVersion is not on nuget.org"
              }
              $published = ($resp.Content | ConvertFrom-Json).versions
              if ($published -notcontains $pkgVersion) {
                throw "server.json nuget package $id@$pkgVersion is not on nuget.org"
              }
            }
          }
          $changelog = Get-Content CHANGELOG.md -Raw
          if ($changelog -notmatch '(?m)^## (\d+\.\d+\.\d+)\b') { throw "CHANGELOG.md missing ## MAJOR.MINOR.PATCH heading" }
          $released = $Matches[1]
          $unreleasedHasEntries = $false
          if ($changelog -match '(?ms)^## Unreleased\b(.*?)(?=^## |\z)') {
            $unreleased = $Matches[1]
            # A bullet counts only while the most recent ### heading is Added/Changed/Fixed/Security (or before any heading); ### Docs/### Tests must come after product subsections.
            $inProductSection = $true
            foreach ($line in ($unreleased -split "`n")) {
              if ($line -match '^### ') {
                $inProductSection = $line -match '^### (Added|Changed|Fixed|Security)\b'
              } elseif ($inProductSection -and $line -match '^- ') {
                $unreleasedHasEntries = $true
                break
              }
            }
          }
          if ($unreleasedHasEntries) {
            if ($version -eq $released) {
              throw "Unreleased has product entries but Version '$version' still equals previous release '$released'"
            }
          } elseif ($released -ne $version) {
            throw "CHANGELOG version '$released' != csproj '$version'"
          }

      - name: Restore
        run: dotnet restore DotNetMcp.slnx

      - name: Check for known vulnerable packages
        # The dependency graph is the same on every OS, so one runner is enough.
        if: matrix.os == 'ubuntu-latest'
        shell: pwsh
        run: |
          # dotnet list package exits 0 even when it finds advisories, so read its JSON report.
          $text = dotnet list src/DotNetMcp.Server/DotNetMcp.Server.csproj package --vulnerable --include-transitive --format json | Out-String
          if ($LASTEXITCODE -ne 0) { throw "dotnet list package failed with exit code ${LASTEXITCODE}: $text" }
          $start = $text.IndexOf('{')
          if ($start -lt 0) { throw "dotnet list package printed no JSON report: $text" }
          $report = $text.Substring($start) | ConvertFrom-Json
          $advisories = foreach ($project in @($report.projects) | Where-Object { $null -ne $_ }) {
            foreach ($framework in @($project.frameworks) | Where-Object { $null -ne $_ }) {
              $packages = @($framework.topLevelPackages) + @($framework.transitivePackages) | Where-Object { $null -ne $_ }
              foreach ($package in $packages) {
                foreach ($vulnerability in @($package.vulnerabilities) | Where-Object { $null -ne $_ }) {
                  "$($package.id) $($package.resolvedVersion): $($vulnerability.severity) $($vulnerability.advisoryurl)"
                }
              }
            }
          }
          if ($advisories) {
            $advisories | ForEach-Object { Write-Host "::error::$_" }
            throw "Known vulnerable packages found: $(@($advisories).Count) advisory(ies)."
          }
          Write-Host "No known vulnerable packages."

      - name: Build
        run: dotnet build DotNetMcp.slnx -c Release --no-restore

      - name: Test
        # Build first: StdioHostSmokeTests launches DotNetMcp.Server.dll from the test output.
        # MSBuildWorkspace uses MSBuildLocator (DOTNET_ROOT from setup-dotnet).
        run: dotnet test DotNetMcp.slnx -c Release --no-build --verbosity normal

      - name: Pack
        run: dotnet pack src/DotNetMcp.Server -c Release --no-build -o artifacts

      - name: Verify MCP package metadata
        shell: pwsh
        run: |
          $nupkg = Get-ChildItem artifacts/*.nupkg | Select-Object -First 1
          if (-not $nupkg) { throw "nupkg missing" }
          if ($nupkg.Name -notlike "Skymly.DotNetMcp.*") { throw "unexpected package file $($nupkg.Name)" }
          $tmp = Join-Path ([IO.Path]::GetTempPath()) ([guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Path $tmp | Out-Null
          Copy-Item $nupkg.FullName (Join-Path $tmp "pkg.zip")
          Expand-Archive (Join-Path $tmp "pkg.zip") -DestinationPath $tmp -Force
          $nuspec = Get-ChildItem $tmp -Filter *.nuspec | Select-Object -First 1
          if (-not $nuspec) { throw "nuspec missing" }
          $xml = Get-Content $nuspec.FullName -Raw
          if ($xml -notmatch "<id>Skymly.DotNetMcp</id>") { throw "PackageId missing in nuspec" }
          if ($xml -notmatch "McpServer") { throw "PackageType McpServer missing" }
          $serverJson = Join-Path $tmp ".mcp/server.json"
          if (-not (Test-Path $serverJson)) { throw "embedded .mcp/server.json missing" }

      - name: Smoke-test the packed tool
        # Runs the README's `dotnet tool exec` form against the nupkg the Pack step just made. The other stdio
        # tests start the server from the build output, so a problem that exists only in the package would miss them.
        shell: pwsh
        env:
          DOTNET_MCP_PACKED_TOOL_SOURCE: ${{ github.workspace }}/artifacts
        run: |
          dotnet test tests/DotNetMcp.Tests/DotNetMcp.Tests.csproj -c Release --no-build --filter "FullyQualifiedName~PackedToolSmokeTests" --logger "trx;LogFileName=packed-tool.trx" --results-directory TestResults
          if ($LASTEXITCODE -ne 0) { throw "The packed tool smoke test failed." }
          # A skipped test also exits 0, so check that it really ran.
          $trx = [xml](Get-Content TestResults/packed-tool.trx -Raw)
          $counters = $trx.TestRun.ResultSummary.Counters
          if ([int]$counters.passed -lt 1 -or [int]$counters.notExecuted -gt 0) {
            throw "The packed tool smoke test did not run: passed=$($counters.passed) notExecuted=$($counters.notExecuted)"
          }
          Write-Host "Packed tool smoke test passed."
